<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title></title>
</head>

<body>
    <header class="navbar">
        <h1 class="logo">
            Dev<span>FLIX</span>
        </h1>
    </header>

    <section class="container">
        <div class="header-section">
            <h2 class="section-title">Catálogo de Filmes</h2>
        </div>

        <div class="grid-filmes">
            {% for filme in filmes %}
            <div class="card">
                <div class="card-content">
                    <h3>{{ filme.titulo }}</h3>
                    <img class="card-img" src="{{ filme.capa_url }}">
                    <p><strong>Gênero: </strong>{{ filme.genero }}</p>
                    <p><strong>Ano de Lançamento: </strong>{{ filme.ano_lancamento }}</p>
                    <p><strong>Nota: </strong>{{ filme.nota }}</p>
                </div>
            </div>
            {% else %}
            <div class="empty-message">
                <h3>Cadastre seu primeiro filme</h3>
            </div>
            {% endfor %}
        </div>
    </section>
</body>
</html>
